name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik platform klasörlerini oluştur
        run: flutter create --platforms=android --project-name terminal_flutter --org com.example .

      - name: Gercekten indirilebilir en guncel Android SDK'yi bul ve kur
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          CANDIDATES=$($SDKMANAGER --list 2>/dev/null | grep -oE '^  platforms;android-[0-9]+' | grep -oE '[0-9]+' | sort -rn | uniq)

          INSTALLED=""
          for V in $CANDIDATES; do
            echo "Deneniyor: android-$V"
            if $SDKMANAGER "platforms;android-$V" > /tmp/sdk_install.log 2>&1; then
              if ! grep -qi "failed to find package" /tmp/sdk_install.log; then
                INSTALLED=$V
                echo "Basariyla kuruldu: android-$V"
                break
              fi
            fi
          done

          if [ -z "$INSTALLED" ]; then
            echo "Hicbir surum kurulamadi!"
            exit 1
          fi

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = $INSTALLED/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = $INSTALLED/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = $INSTALLED/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = $INSTALLED/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion $INSTALLED/" "$f"
            fi
          done
          echo "Kullanilan SDK: $INSTALLED"
          cat android/app/build.gradle* 2>/dev/null | grep -i sdk

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
