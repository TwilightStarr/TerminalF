name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik android klasorunu olustur (varsa dokunma)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name terminal_flutter --org com.example .
          fi

      - name: Android SDK 37'yi kur ve compileSdk/targetSdk'yi 37'ye sabitle
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          $SDKMANAGER "platforms;android-37" || true

          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 37/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 37/" "$f"
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 37/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 37/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = 37/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion 37/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 37/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion 37/" "$f"
            fi
          done
          echo "--- Sonuc ---"
          cat android/app/build.gradle* 2>/dev/null | grep -i sdk

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Derlenen APK dosyasini kontrol et
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK bulunamadi!"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
