name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik android klasorunu olustur (varsa dokunma)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name terminal_flutter --org com.example .
          fi

      - name: Tum alt projelerin (pluginler dahil) compileSdk surumunu zorla yukselt
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            cat >> android/build.gradle.kts << 'EOF'
          subprojects {
              afterEvaluate {
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.extensions.findByName("android")?.withGroovyBuilder {
                          setProperty("compileSdkVersion", 36)
                      }
                  }
              }
          }
          EOF
          elif [ -f "android/build.gradle" ]; then
            cat >> android/build.gradle << 'EOF'
          subprojects {
              afterEvaluate { proj ->
                  if (proj.plugins.hasPlugin("com.android.application") || proj.plugins.hasPlugin("com.android.library")) {
                      proj.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          fi

      - name: Uygulama adini TerminalF yap
        run: |
          sed -i 's/android:label="[^"]*"/android:label="TerminalF"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Derlenen APK dosyasini kontrol et
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK bulunamadi!"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
