name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik android klasorunu olustur (varsa dokunma)
        run: |
          if [ ! -d "android" ]; then
            echo "android/ klasoru yok, olusturuluyor..."
            flutter create --platforms=android --project-name terminal_flutter --org com.example .
          else
            echo "android/ klasoru zaten mevcut, dokunulmuyor."
          fi

      - run: flutter pub get

      - name: 1. deneme - normal build
        id: build1
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build1.log

      - name: Gerekirse SDK surumunu otomatik yukselt ve tekrar dene
        id: fix_and_retry
        if: steps.build1.outcome == 'failure'
        run: |
          set -o pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          REQUIRED=$(grep -oE 'version [0-9]+ or later' /tmp/build1.log | grep -oE '[0-9]+' | sort -rn | head -1)
          if [ -z "$REQUIRED" ]; then
            echo "Log'da SDK talebi bulunamadi, farkli bir hata olabilir."
            echo "---- HATA LOGU (son 100 satir) ----"
            tail -100 /tmp/build1.log
            exit 1
          fi
          echo "Gereken minimum SDK: $REQUIRED"
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          INSTALLED=""
          for V in $(seq "$REQUIRED" 1 $((REQUIRED + 5))); do
            echo "Deneniyor: android-$V"
            if $SDKMANAGER "platforms;android-$V" > /tmp/sdk_install.log 2>&1; then
              if ! grep -qi "failed to find package" /tmp/sdk_install.log; then
                INSTALLED=$V
                echo "Kuruldu: android-$V"
                break
              fi
            fi
          done
          if [ -z "$INSTALLED" ]; then
            echo "Uygun SDK surumu bulunamadi."
            exit 1
          fi
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = $INSTALLED/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = $INSTALLED/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = $INSTALLED/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion $INSTALLED/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = $INSTALLED/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion $INSTALLED/" "$f"
            fi
          done
          echo "2. deneme basliyor (SDK $INSTALLED ile)..."
          flutter build apk --release 2>&1 | tee /tmp/build2.log

      - name: Basarisizsa hata loglarini dosya olarak hazirla
        if: failure()
        run: |
          mkdir -p /tmp/hata-loglari
          cp /tmp/build1.log /tmp/hata-loglari/1-ilk-deneme.log 2>/dev/null || true
          cp /tmp/build2.log /tmp/hata-loglari/2-ikinci-deneme.log 2>/dev/null || true
          cp /tmp/sdk_install.log /tmp/hata-loglari/3-sdk-kurulum.log 2>/dev/null || true

      - name: Hata loglarini yukle (sadece basarisizlikta)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hata-loglari
          path: /tmp/hata-loglari

      - name: Derlenen APK dosyasini kontrol et
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK dosyasi bulunamadi, build gercekte basarisiz olmus olabilir."
            exit 1
          fi
          echo "APK dosyasi bulundu, boyutu:"
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
