name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik platform klasörlerini oluştur
        run: flutter create --platforms=android --project-name terminal_flutter --org com.example .

      - name: Gercekten var olan en guncel Android SDK'yi bul ve kur
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | $SDKMANAGER --licenses > /dev/null 2>&1 || true
          LATEST=$($SDKMANAGER --list 2>/dev/null | grep -oE '^  platforms;android-[0-9]+' | grep -oE '[0-9]+' | sort -n | tail -1)
          echo "Gercek en guncel SDK: $LATEST"
          $SDKMANAGER "platforms;android-$LATEST"
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = $LATEST/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion $LATEST/" "$f"
              sed -i -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = $LATEST/" "$f"
              sed -i -E "s/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion $LATEST/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*flutter\.targetSdkVersion/targetSdk = $LATEST/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+flutter\.targetSdkVersion/targetSdkVersion $LATEST/" "$f"
              sed -i -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = $LATEST/" "$f"
              sed -i -E "s/targetSdkVersion[[:space:]]+[0-9]+/targetSdkVersion $LATEST/" "$f"
            fi
          done
          cat android/app/build.gradle* 2>/dev/null | grep -i sdk

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
