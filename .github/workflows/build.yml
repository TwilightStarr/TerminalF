name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik android klasorunu olustur (varsa dokunma)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name terminal_flutter --org com.example .
          fi

      - name: Tum alt projelerin (pluginler dahil) compileSdk surumunu zorla yukselt
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            cat >> android/build.gradle.kts << 'EOF'
          subprojects {
              val applyCompileSdkOverride: () -> Unit = {
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      project.extensions.findByName("android")?.withGroovyBuilder {
                          setProperty("compileSdkVersion", 36)
                      }
                  }
              }
              if (project.state.executed) {
                  applyCompileSdkOverride()
              } else {
                  afterEvaluate { applyCompileSdkOverride() }
              }
          }
          EOF
          elif [ -f "android/build.gradle" ]; then
            cat >> android/build.gradle << 'EOF'
          subprojects {
              def applyCompileSdkOverride = {
                  if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
              if (project.state.executed) {
                  applyCompileSdkOverride()
              } else {
                  afterEvaluate { applyCompileSdkOverride() }
              }
          }
          EOF
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/c
