name: Build APK

on:
  push:
    branches: [ main ]
    # Yalnizca dokuman degisince yeni surum cikmasin.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  workflow_dispatch:

permissions:
  contents: write   # yalnizca v* etiketinde Release olusturmak icin

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false   # yayin sirasi bozulmasin

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # surum hesabi icin tum etiketler gerekli

      # Surum otomatik hesaplanir (ilk surum 2.0.0):
      #   commit mesajinda [major] -> X+1.0.0
      #   commit mesajinda [minor] -> X.Y+1.0
      #   aksi halde               -> X.Y.Z+1 (yama)
      # 2.0.0'dan kucuk eski etiketler (v0.x, v1.x) yok sayilir.
      - name: Surumu hesapla
        id: ver
        run: |
          last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v([2-9]|[1-9][0-9]+)\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -z "$last" ]; then
            next="2.0.0"
          else
            IFS=. read -r MA MI PA <<< "${last#v}"
            msg=$(git log -1 --pretty=%B)
            if   echo "$msg" | grep -qiF '[major]'; then MA=$((MA+1)); MI=0; PA=0
            elif echo "$msg" | grep -qiF '[minor]'; then MI=$((MI+1)); PA=0
            else PA=$((PA+1)); fi
            next="$MA.$MI.$PA"
          fi
          echo "Onceki: ${last:-yok}  ->  Yeni: v$next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Derleme testi: ana kod + test kodu derlenir, sonra birim testleri kosulur.
      # --continue: ilk hatada durmaz, tum hatalar rapora girer.
      - name: Derleme ve birim testleri
        run: |
          set -o pipefail
          ./gradlew --no-daemon --continue --warning-mode all \
            :app:compileDebugKotlin :app:compileDebugUnitTestKotlin :app:testDebugUnitTest \
            2>&1 | tee gradle-build.log

      # Imza anahtari tamamen otomatik yonetilir (elle bir sey yapmak gerekmez):
      #  - Ilk derlemede CI anahtari kendisi uretir ve "signing-keys" dalina kaydeder.
      #  - Sonraki her derleme ayni anahtari o daldan okur -> tum surumler ayni imzayla cikar
      #    ve mevcut kurulumun uzerine guncellenir.
      #  - Istege bagli: KEYSTORE_BASE64 secret'i tanimliysa onun yerine o kullanilir.
      # "signing-keys" dali main'den bagimsizdir; main'e yapilan push'lar ona dokunmaz.
      - name: Surum imzasini hazirla
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          JKS="$RUNNER_TEMP/release.jks"
          PASS="terminalf-update"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Imza: KEYSTORE_BASE64 secret'i kullaniliyor."
            echo "$KEYSTORE_B64" | base64 -d > "$JKS"
          elif git ls-remote --exit-code --heads origin signing-keys >/dev/null 2>&1; then
            echo "Imza: signing-keys dalindaki kayitli anahtar kullaniliyor."
            git fetch --depth=1 origin signing-keys
            git show FETCH_HEAD:terminalf.jks.b64 | base64 -d > "$JKS"
          else
            echo "Imza: ilk derleme, anahtar uretiliyor ve signing-keys dalina kaydediliyor."
            keytool -genkeypair -keystore "$JKS" -storetype PKCS12 -alias terminalf \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=TerminalF, O=TerminalF, C=TR"
            D="$(mktemp -d)"
            base64 -w0 "$JKS" > "$D/terminalf.jks.b64"
            git -C "$D" init -q -b signing-keys
            git -C "$D" config user.name "github-actions[bot]"
            git -C "$D" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "$D" add terminalf.jks.b64
            git -C "$D" commit -q -m "Imza anahtari (otomatik uretildi)"
            git -C "$D" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            git -C "$D" push origin signing-keys
          fi
          keytool -list -keystore "$JKS" -storepass "$PASS" -alias terminalf >/dev/null
          {
            echo "storeFile=$JKS"
            echo "storePassword=$PASS"
            echo "keyAlias=terminalf"
            echo "keyPassword=$PASS"
          } > key.properties

      - name: APK derle (surum ${{ steps.ver.outputs.version }})
        run: |
          set -o pipefail
          ./gradlew --no-daemon --warning-mode all :app:assembleRelease \
            -PversionName=${{ steps.ver.outputs.version }} \
            -PversionCode=$(( $(date +%s) / 60 )) 2>&1 | tee -a gradle-build.log
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             dist/TerminalF-v${{ steps.ver.outputs.version }}.apk

      # Test raporlari: basarili/basarisiz fark etmeksizin "Reports" adiyla yuklenir.
      # GitHub bir artifact'i zip olarak indirtir -> Actions sayfasindan Reports.zip.
      - name: Raporlari topla
        if: always()
        run: |
          mkdir -p Reports
          cp -r app/build/reports        Reports/reports      2>/dev/null || true
          cp -r app/build/test-results   Reports/test-results 2>/dev/null || true
          cp gradle-build.log            Reports/             2>/dev/null || true
          {
            echo "Calistirma : ${{ github.workflow }} #${{ github.run_number }}"
            echo "Commit     : ${{ github.sha }}"
            echo "Sonuc      : ${{ job.status }}"
            echo
            echo "== Derleme hatalari / uyarilari (gradle-build.log) =="
            grep -E '^(e|w): ' gradle-build.log 2>/dev/null || echo "(yok)"
            echo
            echo "== Test ozeti =="
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t = f = e = s = 0
          for p in glob.glob("app/build/test-results/**/*.xml", recursive=True):
              r = ET.parse(p).getroot()
              t += int(r.get("tests", 0)); f += int(r.get("failures", 0))
              e += int(r.get("errors", 0)); s += int(r.get("skipped", 0))
          print(f"toplam={t} basarisiz={f} hata={e} atlanan={s}")
          PY
          } > Reports/OZET.txt
          cat Reports/OZET.txt

      - name: Reports.zip yukle
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Reports
          path: Reports
          if-no-files-found: warn

      - name: APK'yi yukle
        uses: actions/upload-artifact@v6
        with:
          name: app-release-apk
          path: dist/TerminalF-v${{ steps.ver.outputs.version }}.apk

      - name: GitHub Release olustur (main'e her push)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TerminalF v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/TerminalF-v${{ steps.ver.outputs.version }}.apk
          generate_release_notes: true
