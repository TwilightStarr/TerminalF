name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Eksik android klasorunu olustur (varsa dokunma)
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --project-name terminal_flutter --org com.example .
          fi

      - name: Tum alt projelerin (pluginler dahil) compileSdk surumunu zorla yukselt
        run: |
          if [ -f "android/build.gradle.kts" ]; then
            {
              echo 'subprojects {'
              echo '    val applyCompileSdkOverride: () -> Unit = {'
              echo '        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {'
              echo '            project.extensions.findByName("android")?.withGroovyBuilder {'
              echo '                setProperty("compileSdkVersion", 36)'
              echo '            }'
              echo '        }'
              echo '    }'
              echo '    if (project.state.executed) {'
              echo '        applyCompileSdkOverride()'
              echo '    } else {'
              echo '        afterEvaluate { applyCompileSdkOverride() }'
              echo '    }'
              echo '}'
            } >> android/build.gradle.kts
          elif [ -f "android/build.gradle" ]; then
            {
              echo 'subprojects {'
              echo '    def applyCompileSdkOverride = {'
              echo "        if (project.plugins.hasPlugin('com.android.application') || project.plugins.hasPlugin('com.android.library')) {"
              echo '            project.android {'
              echo '                compileSdkVersion 36'
              echo '            }'
              echo '        }'
              echo '    }'
              echo '    if (project.state.executed) {'
              echo '        applyCompileSdkOverride()'
              echo '    } else {'
              echo '        afterEvaluate { applyCompileSdkOverride() }'
              echo '    }'
              echo '}'
            } >> android/build.gradle
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' android/app/build.gradle
          fi

      - name: JVM hedef dogrulamasini gevset (pluginlerdeki Java/Kotlin uyusmazligini engelle)
        run: |
          if [ -f "android/gradle.properties" ]; then
            echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties
          else
            echo "kotlin.jvm.target.validation.mode=warning" > android/gradle.properties
          fi

      - name: Uygulama adini TerminalF yap
        run: |
          sed -i 's/android:label="[^"]*"/android:label="TerminalF"/' android/app/src/main/AndroidManifest.xml

      - name: AndroidManifest.xml'e izinleri, queries ve Shizuku provider'ini ekle
        run: |
          python3 - <<'PY'
          import re

          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, encoding='utf-8') as f:
              manifest = f.read()

          # QUERY_ALL_PACKAGES icin tools:ignore gerekiyor -> tools ad alani.
          if 'xmlns:tools=' not in manifest:
              manifest = manifest.replace(
                  '<manifest ',
                  '<manifest xmlns:tools="http://schemas.android.com/tools" ',
                  1,
              )

          # (izin adi, tam satir) - zaten varsa tekrar eklenmez (idempotent).
          permissions = [
              ('android.permission.INTERNET',
               '<uses-permission android:name="android.permission.INTERNET"/>'),
              ('android.permission.VIBRATE',
               '<uses-permission android:name="android.permission.VIBRATE"/>'),
              ('android.permission.POST_NOTIFICATIONS',
               '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'),
              ('android.permission.QUERY_ALL_PACKAGES',
               '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>'),
              ('moe.shizuku.manager.permission.API_V23',
               '<uses-permission android:name="moe.shizuku.manager.permission.API_V23"/>'),
          ]
          missing = [line for name, line in permissions
                     if 'android:name="%s"' % name not in manifest]

          # <queries>: Flutter sablonu zaten bir <queries> blogu icerebilir;
          # varsa Shizuku paketini onun icine, yoksa yeni blok olarak ekle.
          shizuku_pkg = '<package android:name="moe.shizuku.privileged.api"/>'
          if 'moe.shizuku.privileged.api' not in manifest:
              if '</queries>' in manifest:
                  manifest = manifest.replace(
                      '</queries>', '    ' + shizuku_pkg + '\n    </queries>', 1)
              else:
                  missing.append('<queries>' + shizuku_pkg + '</queries>')

          if missing:
              block = ''.join('    ' + line + '\n' for line in missing)
              manifest = re.sub(r'([ \t]*)<application', lambda m: block + m.group(0),
                                manifest, count=1)

          provider = ('    <provider android:name="rikka.shizuku.ShizukuProvider" '
                      'android:authorities="${applicationId}.shizuku" '
                      'android:multiprocess="false" android:enabled="true" '
                      'android:exported="true" '
                      'android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />\n')
          if 'rikka.shizuku.ShizukuProvider' not in manifest:
              manifest = manifest.replace('</application>', provider + '    </application>', 1)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(manifest)
          PY

      - name: Manifest'i dogrula (eksik izin/bilesen varsa derlemeyi durdur)
        run: |
          cat android/app/src/main/AndroidManifest.xml
          for needle in \
            'android.permission.INTERNET' \
            'android.permission.VIBRATE' \
            'android.permission.POST_NOTIFICATIONS' \
            'android.permission.QUERY_ALL_PACKAGES' \
            'moe.shizuku.manager.permission.API_V23' \
            'moe.shizuku.privileged.api' \
            'rikka.shizuku.ShizukuProvider'; do
            if ! grep -q "$needle" android/app/src/main/AndroidManifest.xml; then
              echo "Manifest'te eksik: $needle"
              exit 1
            fi
          done

      - name: minSdk'yi Shizuku icin 24'e yukselt
        run: |
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle
          fi

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Derlenen APK dosyasini kontrol et
        run: |
          if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            echo "APK bulunamadi!"
            exit 1
          fi
          ls -la build/app/outputs/flutter-apk/app-release.apk

      - name: APK'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
